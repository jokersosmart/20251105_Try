## 快取策略

### 後端 API 回應快取

**策略**: 短時間記憶體快取（5 分鐘）

**目的**:
- 減少重複 API 呼叫
- 節省 API 配額
- 提升回應速度

**實作**:
```typescript
import NodeCache from 'node-cache';

const cache = new NodeCache({ 
  stdTTL: 300,  // 5 分鐘
  checkperiod: 60 
});

async function getComments(mediaId: string, cursor?: string) {
  const cacheKey = `${mediaId}_${cursor || 'first'}`;
  
  // 檢查快取
  const cached = cache.get(cacheKey);
  if (cached) {
    return cached;
  }
  
  // 呼叫 API
  const response = await callGraphAPI(mediaId, cursor);
  
  // 儲存快取
  cache.set(cacheKey, response);
  
  return response;
}
```

**快取失效**:
- 5 分鐘自動過期
- 使用者手動「更新留言」時清除特定貼文快取
- 批次爬取不使用快取（確保最新資料）

