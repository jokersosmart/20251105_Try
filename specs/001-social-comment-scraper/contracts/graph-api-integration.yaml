## 監控與日誌

### 需要記錄的事件

**成功事件**:
- API 呼叫成功（記錄 postUrl, platform, commentCount, duration）
- 配額使用情況（每小時統計）

**錯誤事件**:
- API 錯誤（記錄 error code, message, postUrl）
- 速率限制觸發（記錄時間、使用者 IP）
- Token 失效（立即通知管理員）

**效能指標**:
- API 回應時間（p50, p95, p99）
- 快取命中率
- 錯誤率

### Sentry 整合

```typescript
import * as Sentry from '@sentry/node';

Sentry.init({
  dsn: process.env.SENTRY_DSN,
  environment: process.env.VERCEL_ENV
});

// 記錄 API 錯誤
Sentry.captureException(error, {
  tags: {
    platform: 'instagram',
    endpoint: 'comments'
  },
  extra: {
    postUrl,
    errorCode: error.code
  }
});
```

