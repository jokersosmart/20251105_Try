## 安全性考量

### Token 保護

**儲存位置**:
```bash
# Vercel 環境變數
INSTAGRAM_APP_TOKEN=your_instagram_token
FACEBOOK_APP_TOKEN=your_facebook_token
```

**存取方式**:
```typescript
// 僅在後端代理層存取
const token = process.env.INSTAGRAM_APP_TOKEN;

// ❌ 絕對不可在前端存取或暴露
```

### CORS 設定

**允許的來源**:
```typescript
const allowedOrigins = [
  'https://your-app.vercel.app',
  'http://localhost:5173',  // 開發環境
  'http://localhost:3000'
];

function checkOrigin(origin: string): boolean {
  return allowedOrigins.includes(origin);
}
```

### 輸入驗證

**後端必須驗證**:
- URL 格式正確
- 參數類型正確（limit 是數字）
- Cursor 格式有效（若提供）

**防止注入攻擊**:
- 使用參數化查詢
- 驗證所有輸入
- 清理特殊字元

