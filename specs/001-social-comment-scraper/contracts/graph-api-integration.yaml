# Instagram/Facebook Graph API 整合契約

## 文件說明

本文件定義後端 API 代理層與 Instagram/Facebook Graph API 的整合規格。
包含端點、請求格式、回應處理和錯誤映射。

---

## Instagram Graph API 整合

### API 版本
- **版本**: v18.0（或更新穩定版）
- **Base URL**: `https://graph.facebook.com/v18.0`
- **文件**: https://developers.facebook.com/docs/instagram-api

### 權限需求
- `instagram_basic`: 基本資料存取
- `instagram_manage_comments`: 留言資料存取

### 端點 1: 取得貼文留言

**請求**:
```
GET https://graph.facebook.com/v18.0/{media-id}/comments
```

**必要參數**:
- `access_token`: App Access Token（從環境變數取得）
- `fields`: `id,username,text,timestamp,like_count,replies`

**選用參數**:
- `after`: 分頁 cursor（續傳使用）
- `limit`: 每頁數量（預設 25，最大 50）

**請求範例**:
```
GET /17893857392847501/comments?access_token=XXX&fields=id,username,text,timestamp,like_count,replies&limit=50
```

**成功回應**（200 OK）:
```json
{
  "data": [
    {
      "id": "17893857392847501",
      "username": "john_doe",
      "text": "很棒的照片！",
      "timestamp": "2025-11-18T10:30:00+0000",
      "like_count": 5,
      "replies": {
        "data": []
      }
    }
  ],
  "paging": {
    "cursors": {
      "before": "QVFIUkhBU...",
      "after": "QVFIUkY3d..."
    },
    "next": "https://graph.facebook.com/v18.0/..."
  }
}
```

**錯誤回應**:
```json
{
  "error": {
    "message": "Invalid OAuth access token.",
    "type": "OAuthException",
    "code": 190,
    "fbtrace_id": "..."
  }
}
```

### 錯誤碼映射（Instagram）

| API Error Code | 類型 | 繁體中文訊息 | 處理方式 |
|---------------|------|-------------|---------|
| 190 | OAuthException | Token 無效或過期，請聯繫技術支援 | 記錄錯誤，通知管理員 |
| 4 | API Too Many Calls | 請求過於頻繁，請等待 X 分鐘後再試 | 返回 429，顯示 retryAfter |
| 100 | Invalid Parameter | 貼文網址格式不正確 | 返回 400，要求重新輸入 |
| 803 | Cannot Access Media | 此貼文為私人貼文或無法存取 | 返回 403，說明原因 |
| 10 | Permission Denied | 權限不足，無法存取此貼文 | 返回 403，說明權限問題 |

