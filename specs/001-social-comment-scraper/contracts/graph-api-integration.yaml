## Facebook Graph API 整合

### API 版本
- **版本**: v18.0（或更新穩定版）
- **Base URL**: `https://graph.facebook.com/v18.0`
- **文件**: https://developers.facebook.com/docs/graph-api

### 權限需求
- `pages_read_engagement`: 讀取粉絲專頁互動資料

### 端點 1: 取得貼文留言

**請求**:
```
GET https://graph.facebook.com/v18.0/{post-id}/comments
```

**必要參數**:
- `access_token`: App Access Token
- `fields`: `id,from{name,id},message,created_time,like_count,comment_count`

**選用參數**:
- `after`: 分頁 cursor
- `limit`: 每頁數量（預設 25，最大 100）
- `order`: `chronological` 或 `reverse_chronological`

**請求範例**:
```
GET /123456789_987654321/comments?access_token=XXX&fields=id,from,message,created_time,like_count,comment_count&limit=100
```

**成功回應**（200 OK）:
```json
{
  "data": [
    {
      "id": "123456789_111111111",
      "from": {
        "name": "王小明",
        "id": "987654321"
      },
      "message": "很實用的資訊！",
      "created_time": "2025-11-18T08:20:00+0000",
      "like_count": 3,
      "comment_count": 1
    }
  ],
  "paging": {
    "cursors": {
      "before": "MAZDZD",
      "after": "MQZDZD"
    },
    "next": "https://graph.facebook.com/v18.0/..."
  }
}
```

### 錯誤碼映射（Facebook）

| API Error Code | 類型 | 繁體中文訊息 | 處理方式 |
|---------------|------|-------------|---------|
| 190 | OAuthException | Token 無效，請聯繫技術支援 | 記錄錯誤，通知管理員 |
| 4 | API Too Many Calls | 請求過於頻繁，請稍後再試 | 返回 429 + retryAfter |
| 100 | Invalid Parameter | 貼文 ID 格式不正確 | 返回 400 |
| 200 | Permission Denied | 此貼文為私人或權限不足 | 返回 403 |
| 803 | Cannot Access Object | 貼文不存在或已被刪除 | 返回 404 |
| 2 | Temporary Error | 暫時性錯誤，請稍後再試 | 返回 503，可重試 |

