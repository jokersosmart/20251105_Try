## 速率限制處理

### Instagram 速率限制

**配額**:
- 200 calls/hour per app（應用程式層級）
- 回應 header 中的 `x-app-usage`:
  ```json
  {
    "call_count": 45,
    "total_cputime": 25,
    "total_time": 10
  }
  ```

**處理邏輯**:
```typescript
// 後端代理層
function parseAppUsage(headers) {
  const usage = JSON.parse(headers['x-app-usage']);
  const callPercent = usage.call_count;
  
  if (callPercent > 90) {
    // 接近限制，觸發節流
    return { shouldThrottle: true, usage: callPercent };
  }
  
  return { shouldThrottle: false, usage: callPercent };
}
```

### Facebook 速率限制

**配額**:
- 依應用程式等級（Basic: 200 calls/hour）
- 回應 header 中的 `x-app-usage` 和 `x-ad-account-usage`

**超過限制時**:
- API 回傳 `429 Too Many Requests`
- Header 包含 `retry-after`（秒數）
- 後端代理需解析並傳遞給前端

