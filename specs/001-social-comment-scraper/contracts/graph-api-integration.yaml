### 契約測試案例

**測試 1: 驗證 API 回應格式**
```typescript
describe('Instagram API Contract', () => {
  it('應返回符合預期格式的留言資料', async () => {
    const response = await fetch('/api/instagram/scrape', {
      method: 'POST',
      body: JSON.stringify({ postUrl: 'https://www.instagram.com/p/TEST/' })
    });
    
    const data = await response.json();
    
    expect(data).toHaveProperty('success', true);
    expect(data.data.comments).toBeInstanceOf(Array);
    expect(data.data.comments[0]).toHaveProperty('id');
    expect(data.data.comments[0]).toHaveProperty('username');
    expect(data.data.comments[0]).toHaveProperty('text');
  });
});
```

**測試 2: 驗證錯誤處理**
```typescript
it('應正確處理無效網址錯誤', async () => {
  const response = await fetch('/api/instagram/scrape', {
    method: 'POST',
    body: JSON.stringify({ postUrl: 'invalid-url' })
  });
  
  const data = await response.json();
  
  expect(data.success).toBe(false);
  expect(data.error).toBe('INVALID_URL');
  expect(data.message).toContain('網址格式不正確');
});
```

**測試 3: 驗證速率限制處理**
```typescript
it('應正確處理速率限制', async () => {
  // 模擬達到速率限制
  server.use(
    rest.get('*/comments', (req, res, ctx) => {
      return res(
        ctx.status(429),
        ctx.json({
          error: {
            code: 4,
            message: "API Too Many Calls"
          }
        })
      );
    })
  );
  
  const response = await fetch('/api/instagram/scrape', {
    method: 'POST',
    body: JSON.stringify({ postUrl: 'https://www.instagram.com/p/TEST/' })
  });
  
  const data = await response.json();
  
  expect(response.status).toBe(429);
  expect(data.message).toContain('請等待');
  expect(data).toHaveProperty('retryAfter');
});
```

