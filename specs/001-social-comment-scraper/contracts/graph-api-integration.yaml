## URL 解析規則

### Instagram URL 格式

**標準格式**:
```
https://www.instagram.com/p/{media-id}/
https://instagram.com/p/{media-id}/
```

**解析邏輯**:
```typescript
function parseInstagramUrl(url: string): string | null {
  const regex = /instagram\.com\/p\/([A-Za-z0-9_-]+)/;
  const match = url.match(regex);
  return match ? match[1] : null;
}

// 範例
parseInstagramUrl("https://www.instagram.com/p/ABC123xyz/")
// 返回: "ABC123xyz"
```

### Facebook URL 格式

**可能格式**:
```
https://www.facebook.com/{page-name}/posts/{post-id}
https://www.facebook.com/{page-id}/posts/{post-id}
https://www.facebook.com/permalink.php?story_fbid={post-id}&id={page-id}
https://www.facebook.com/photo.php?fbid={photo-id}&set=...
```

**解析邏輯**（較複雜）:
```typescript
function parseFacebookUrl(url: string): string | null {
  // 格式 1: /posts/
  const postsRegex = /facebook\.com\/[\w.-]+\/posts\/(\d+)/;
  let match = url.match(postsRegex);
  if (match) return match[1];
  
  // 格式 2: permalink.php
  const permalinkRegex = /story_fbid=(\d+)/;
  match = url.match(permalinkRegex);
  if (match) return match[1];
  
  // 格式 3: 完整 post ID（page_id_post_id）
  const fullIdRegex = /(\d+_\d+)/;
  match = url.match(fullIdRegex);
  if (match) return match[1];
  
  return null;
}
```

