## 資料轉換與正規化

### Instagram 資料轉換

**從 API 回應轉換為內部格式**:
```typescript
function normalizeInstagramComment(apiComment: any): Comment {
  return {
    commentId: apiComment.id,
    commenterName: apiComment.username,
    commenterAvatar: `https://www.instagram.com/${apiComment.username}/`, // 推估
    commenterId: apiComment.user_id || '',
    content: apiComment.text,
    timestamp: new Date(apiComment.timestamp),
    likeCount: apiComment.like_count || 0,
    replyCount: apiComment.replies?.data?.length || 0,
    isEdited: false,
    customFields: {},
    createdAt: new Date()
  };
}
```

### Facebook 資料轉換

```typescript
function normalizeFacebookComment(apiComment: any): Comment {
  return {
    commentId: apiComment.id,
    commenterName: apiComment.from.name,
    commenterAvatar: `https://graph.facebook.com/${apiComment.from.id}/picture`,
    commenterId: apiComment.from.id,
    content: apiComment.message,
    timestamp: new Date(apiComment.created_time),
    likeCount: apiComment.like_count || 0,
    replyCount: apiComment.comment_count || 0,
    isEdited: false,
    customFields: {},
    createdAt: new Date()
  };
}
```

