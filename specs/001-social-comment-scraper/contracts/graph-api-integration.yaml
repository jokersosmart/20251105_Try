## 請求流程

### 完整請求流程（Instagram 範例）

```
1. 前端發起請求
   POST /api/instagram/scrape
   { postUrl: "https://www.instagram.com/p/ABC123/" }
   
2. 後端代理驗證
   - 檢查 Origin header（CORS）
   - 檢查速率限制（Token Bucket）
   - 解析 postUrl 取得 media-id
   
3. 呼叫 Instagram Graph API
   GET https://graph.facebook.com/v18.0/{media-id}/comments
   Authorization: Bearer {APP_ACCESS_TOKEN}
   
4. 處理回應
   - 成功：轉換資料格式，返回前端
   - 錯誤：映射為繁體中文錯誤訊息
   
5. 更新速率限制狀態
   - 解析 x-app-usage header
   - 更新 Token Bucket
   
6. 返回前端
   { success: true, data: {...} }
```

### 錯誤處理流程

```
1. API 回傳錯誤
   
2. 後端代理解析錯誤碼
   
3. 映射為繁體中文訊息
   error code 190 → "Token 無效"
   error code 4 → "請求過於頻繁"
   
4. 構建統一錯誤回應
   {
     success: false,
     error: "RATE_LIMIT_EXCEEDED",
     message: "請求過於頻繁，請等待 15 分鐘後再試",
     retryAfter: 900
   }
   
5. 返回前端顯示
```

